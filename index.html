<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BounceQuiz AI - Analisis Peluang Usaha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .ball {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s, opacity 0.3s;
            user-select: none;
        }
        .ball:hover {
            transform: scale(1.1);
        }
        .ball.answered {
            opacity: 0;
            pointer-events: none; /* Make it unclickable and invisible after answered */
        }
        
        /* Custom scrollbar for modal content if needed */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        
        @keyframes firework {
            0% { transform: translate(var(--x), var(--initialY)) scale(1); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        .particle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
            z-index: 100;
        }
        @keyframes sadDrop {
            0% { transform: translate(-50%, -150%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, 150%) scale(0.5); opacity: 0; }
        }
        .sad-face {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 8rem;
            animation: sadDrop 2s ease-in-out forwards;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white p-4 shadow-md flex-shrink-0">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">BounceQuiz AI</h1>
                <p class="text-indigo-200 text-sm mt-1">Kreativitas Inovasi dan Kewirausahaan | Setara SMA / Paket C</p>
                <p class="text-indigo-100 text-xs font-semibold">Materi: Analisis Peluang Usaha dengan Metode SWOT</p>
            </div>
            <div class="flex items-center gap-3 mt-3 md:mt-0">
                <button id="pause-btn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold px-4 py-2 rounded-lg shadow-md transition-colors border border-yellow-500 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    Pause Bola
                </button>
                <div class="flex gap-4 bg-indigo-800 px-4 py-2 rounded-lg border border-indigo-500 shadow-inner">
                    <div class="text-center">
                        <p class="text-indigo-300 text-xs uppercase tracking-wider font-bold">Terjawab</p>
                        <p class="text-xl font-bold" id="progress-text">0 / 10</p>
                    </div>
                    <div class="w-px bg-indigo-500"></div>
                    <div class="text-center">
                        <p class="text-indigo-300 text-xs uppercase tracking-wider font-bold">Skor Benar</p>
                        <p class="text-xl font-bold text-green-400" id="score-text">0</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 flex justify-center items-center relative max-w-5xl mx-auto w-full">
        <!-- Bouncing container -->
        <div id="game-container" class="relative w-full h-[65vh] bg-white border-4 border-indigo-300 rounded-2xl overflow-hidden shadow-lg">
            <!-- Balls will be injected here via JS -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-10">
                <span class="text-6xl font-black text-indigo-900">SWOT</span>
            </div>
        </div>
    </main>

    <!-- Question Modal -->
    <div id="question-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div id="effect-container" class="absolute inset-0 pointer-events-none z-50 overflow-hidden"></div>
        
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-full z-10">
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold">Pertanyaan Bola #<span id="modal-ball-number">1</span></h2>
            </div>
            
            <div class="p-6 overflow-y-auto modal-content flex-grow">
                <p id="question-text" class="text-gray-800 text-lg font-semibold mb-6"></p>
                
                <div id="options-container" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback & Explanation (Hidden initially) -->
                <div id="feedback-container" class="mt-6 hidden p-4 rounded-xl">
                    <h3 id="feedback-title" class="font-bold text-lg mb-2"></h3>
                    <p id="explanation-text" class="text-gray-700 text-sm leading-relaxed"></p>
                </div>
            </div>

            <div class="bg-gray-100 p-4 flex justify-end">
                <button id="btn-lanjut" class="hidden px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition-colors shadow-md">
                    Tutup & Lanjut
                </button>
            </div>
        </div>
    </div>

    <!-- End Screen Modal -->
    <div id="end-modal" class="fixed inset-0 bg-gray-900 bg-opacity-80 z-50 hidden flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 text-center">
            <h2 class="text-3xl font-black text-indigo-600 mb-2">BounceQuiz Selesai!</h2>
            <p class="text-gray-500 font-semibold mb-6">Hasil Akhir Anda</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6 text-left">
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <p class="text-xs text-gray-500 uppercase font-bold">Total Soal</p>
                    <p class="text-xl font-black text-gray-800">10</p>
                </div>
                <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-200">
                    <p class="text-xs text-indigo-500 uppercase font-bold">Nilai Akhir</p>
                    <p class="text-xl font-black text-indigo-700" id="final-score">100</p>
                </div>
                <div class="bg-green-50 p-3 rounded-lg border border-green-200">
                    <p class="text-xs text-green-600 uppercase font-bold">Jawaban Benar</p>
                    <p class="text-xl font-black text-green-700" id="final-correct">10</p>
                </div>
                <div class="bg-red-50 p-3 rounded-lg border border-red-200">
                    <p class="text-xs text-red-500 uppercase font-bold">Jawaban Salah</p>
                    <p class="text-xl font-black text-red-700" id="final-wrong">0</p>
                </div>
            </div>
            
            <button onclick="initGame()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-black rounded-xl shadow-lg transition-transform transform hover:scale-105">
                MAIN LAGI
            </button>
        </div>
    </div>

    <script>
        // Data Soal Lengkap dan Valid (Materi SWOT, Paket C C1-C3)
        const quizData = [
            {
                q: "Kepanjangan dari metode analisis SWOT yang benar adalah...",
                options: [
                    "Strengths, Weaknesses, Opportunities, Threats",
                    "Strengths, Wealth, Options, Threats",
                    "System, Weaknesses, Opportunities, Time",
                    "Strengths, Weaknesses, Options, Time"
                ],
                correct: 0,
                explanation: "SWOT merupakan akronim dari bahasa Inggris yang berarti Strengths (Kekuatan), Weaknesses (Kelemahan), Opportunities (Peluang), dan Threats (Ancaman)."
            },
            {
                q: "Dalam analisis SWOT, unsur yang termasuk ke dalam 'Faktor Internal' sebuah usaha adalah...",
                options: [
                    "Peluang dan Ancaman",
                    "Kekuatan dan Kelemahan",
                    "Kekuatan dan Peluang",
                    "Kelemahan dan Ancaman"
                ],
                correct: 1,
                explanation: "Faktor internal berasal dari dalam usaha itu sendiri, yaitu apa yang menjadi Kekuatan (Strengths) dan Kelemahan (Weaknesses) perusahaan."
            },
            {
                q: "Sebuah usaha keripik pisang lokal memiliki 'resep bumbu rahasia' yang sangat disukai warga dan tidak dimiliki oleh pesaing mana pun. Dalam analisis SWOT, hal ini diklasifikasikan sebagai...",
                options: [
                    "Threats (Ancaman)",
                    "Opportunities (Peluang)",
                    "Strengths (Kekuatan)",
                    "Weaknesses (Kelemahan)"
                ],
                correct: 2,
                explanation: "Keunggulan kompetitif yang dimiliki oleh usaha tersebut dari dalam (resep rahasia yang unggul) merupakan sebuah Kekuatan (Strengths)."
            },
            {
                q: "Pak Budi melihat bahwa di sekitar lingkungan PKBM belum ada yang menjual minuman dingin yang sehat, sementara cuaca sering panas. Kondisi lingkungan ini dalam SWOT disebut sebagai...",
                options: [
                    "Opportunities (Peluang)",
                    "Strengths (Kekuatan)",
                    "Threats (Ancaman)",
                    "Weaknesses (Kelemahan)"
                ],
                correct: 0,
                explanation: "Kondisi eksternal (cuaca panas dan belum ada pesaing) yang dapat dimanfaatkan untuk mengembangkan usaha disebut sebagai Peluang (Opportunities)."
            },
            {
                q: "Usaha katering Ibu Ani sering mendapat komplain dari pelanggan karena pengiriman yang sering terlambat akibat kurangnya armada kurir. Hal ini menunjukkan faktor...",
                options: [
                    "Threats (Ancaman)",
                    "Weaknesses (Kelemahan)",
                    "Opportunities (Peluang)",
                    "Strengths (Kekuatan)"
                ],
                correct: 1,
                explanation: "Kekurangan armada kurir merupakan masalah yang berasal dari internal manajemen katering itu sendiri, sehingga dikategorikan sebagai Kelemahan (Weaknesses)."
            },
            {
                q: "Munculnya pedagang baru di pasar yang menjual produk serupa dengan harga yang jauh lebih murah merupakan contoh dari...",
                options: [
                    "Weaknesses (Kelemahan)",
                    "Strengths (Kekuatan)",
                    "Opportunities (Peluang)",
                    "Threats (Ancaman)"
                ],
                correct: 3,
                explanation: "Pesaing baru dengan harga lebih murah adalah kondisi eksternal yang dapat membahayakan atau menghambat jalannya usaha kita, sehingga disebut Ancaman (Threats)."
            },
            {
                q: "Apa manfaat utama bagi wirausahawan dalam melakukan analisis SWOT sebelum mengeksekusi peluang usaha?",
                options: [
                    "Memastikan pengajuan pinjaman bank pasti diterima",
                    "Memetakan kondisi usaha untuk meminimalkan risiko kegagalan dan memaksimalkan potensi",
                    "Mengurangi pajak yang harus dibayar kepada pemerintah",
                    "Menghilangkan semua bentuk persaingan di pasar"
                ],
                correct: 1,
                explanation: "Analisis SWOT tidak menjamin kredit atau menghilangkan pesaing, melainkan sebagai alat bantu untuk memetakan strategi agar wirausahawan siap menghadapi risiko dan memaksimalkan potensinya."
            },
            {
                q: "Dalam menyusun strategi bisnis berdasarkan SWOT, strategi S-O (Strengths-Opportunities) dilakukan dengan cara...",
                options: [
                    "Menggunakan kekuatan internal untuk memanfaatkan peluang eksternal",
                    "Memperbaiki kelemahan untuk menghindari ancaman",
                    "Menghindari peluang agar kekuatan tidak terkuras",
                    "Menyerang ancaman menggunakan kelemahan"
                ],
                correct: 0,
                explanation: "Strategi S-O adalah strategi yang paling agresif dan positif, di mana pengusaha menggunakan segala Kekuatan (S) yang dimiliki untuk meraih dan memaksimalkan Peluang (O) yang ada di pasar."
            },
            {
                q: "Jika sebuah usaha memiliki kelemahan (W) berupa keterbatasan modal, namun terdapat peluang (O) adanya program pinjaman lunak (KUR) dari pemerintah, maka strategi W-O yang paling tepat adalah...",
                options: [
                    "Mengabaikan program pemerintah karena modal terbatas",
                    "Meminjam uang ke rentenir agar lebih cepat",
                    "Memperbaiki kelemahan modal dengan cara mengajukan dan memanfaatkan program pinjaman pemerintah tersebut",
                    "Menutup usaha sampai memiliki modal sendiri"
                ],
                correct: 2,
                explanation: "Strategi W-O bertujuan untuk menutupi Kelemahan (W) dengan memanfaatkan Peluang eksternal (O), dalam hal ini menggunakan program pemerintah untuk mengatasi kurangnya modal."
            },
            {
                q: "Faktor apa yang biasanya berada di luar kendali pengusaha dan harus diantisipasi dalam pemetaan Ancaman (Threats)?",
                options: [
                    "Kualitas bahan baku yang dibeli sendiri",
                    "Standar pelayanan karyawan di toko",
                    "Perubahan tren konsumen dan regulasi/kebijakan pemerintah",
                    "Desain kemasan produk"
                ],
                correct: 2,
                explanation: "Kualitas, pelayanan, dan desain adalah faktor internal (bisa dikontrol). Sedangkan perubahan tren pasar dan regulasi pemerintah adalah faktor eksternal (luar kendali) yang bisa menjadi Ancaman (Threats)."
            }
        ];

        const gameContainer = document.getElementById('game-container');
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        
        let balls = [];
        let animationId;
        let isPaused = false;
        let isUserPaused = false; // Status pause dari tombol
        let audioInitialized = false; // Mencegah interaksi audio sebelum klik pertama
        
        let score = 0;
        let answeredCount = 0;
        let currentBallIndex = -1; // Which question is currently opened

        // Colors for the balls
        const colors = [
            'bg-red-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 
            'bg-purple-500', 'bg-pink-500', 'bg-teal-500', 'bg-orange-500', 
            'bg-indigo-500', 'bg-cyan-500'
        ];

        function initGame() {
            // Reset state
            cancelAnimationFrame(animationId);
            gameContainer.innerHTML = '<div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-10"><span class="text-6xl font-black text-indigo-900">SWOT</span></div>';
            balls = [];
            score = 0;
            answeredCount = 0;
            isPaused = false;
            isUserPaused = false;
            updatePauseButtonUI();
            
            updateUI();
            document.getElementById('end-modal').classList.add('hidden');
            document.getElementById('question-modal').classList.add('hidden');

            const containerRect = gameContainer.getBoundingClientRect();
            const ballSize = 60; // Base size

            for (let i = 0; i < 10; i++) {
                // Create DOM element
                const ballEl = document.createElement('div');
                ballEl.className = `ball ${colors[i % colors.length]} w-[60px] h-[60px] text-xl border-2 border-white`;
                ballEl.innerText = i + 1;
                
                // Set initial random position
                let x = Math.random() * (containerRect.width - ballSize);
                let y = Math.random() * (containerRect.height - ballSize);
                
                // Set initial random velocity (avoiding purely straight horizontal/vertical)
                let dx = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random() * 2);
                let dy = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random() * 2);

                gameContainer.appendChild(ballEl);

                // Add click listener
                ballEl.addEventListener('click', () => handleBallClick(i, ballEl));

                balls.push({
                    el: ballEl,
                    x: x,
                    y: y,
                    dx: dx,
                    dy: dy,
                    size: ballSize,
                    answered: false
                });
            }

            // Start animation loop
            animate();
        }

        function animate() {
            // Animasi hanya jalan jika tidak dipause sistem dan tidak dipause user
            if (!isPaused && !isUserPaused) {
                const containerRect = gameContainer.getBoundingClientRect();

                balls.forEach(ball => {
                    if (ball.answered) return; // Skip updating answered balls

                    ball.x += ball.dx;
                    ball.y += ball.dy;

                    // Wall Collision (Bounce)
                    if (ball.x <= 0) {
                        ball.x = 0;
                        ball.dx *= -1;
                    } else if (ball.x + ball.size >= containerRect.width) {
                        ball.x = containerRect.width - ball.size;
                        ball.dx *= -1;
                    }

                    if (ball.y <= 0) {
                        ball.y = 0;
                        ball.dy *= -1;
                    } else if (ball.y + ball.size >= containerRect.height) {
                        ball.y = containerRect.height - ball.size;
                        ball.dy *= -1;
                    }

                    // Apply translation
                    ball.el.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
                });
            }
            animationId = requestAnimationFrame(animate);
        }

        function handleBallClick(index, element) {
            initAudio(); // Inisialisasi Tone.js Engine pada klik pertama
            if (balls[index].answered) return;

            isPaused = true;
            currentBallIndex = index;
            const data = quizData[index];

            // Setup Modal Content
            document.getElementById('modal-ball-number').innerText = index + 1;
            document.getElementById('question-text').innerText = data.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Clear previous

            data.options.forEach((optText, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 bg-gray-50 border-2 border-gray-200 rounded-xl hover:bg-indigo-50 hover:border-indigo-300 font-medium text-gray-700 transition-colors duration-200 option-btn';
                
                // Add Alphabet prefix (A, B, C, D)
                const prefix = String.fromCharCode(65 + optIndex);
                btn.innerHTML = `<span class="font-bold mr-2 text-indigo-600">${prefix}.</span> ${optText}`;
                
                btn.onclick = () => handleAnswer(optIndex, data.correct, data.explanation, element);
                optionsContainer.appendChild(btn);
            });

            // Reset UI states
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('btn-lanjut').classList.add('hidden');

            // Show Modal
            document.getElementById('question-modal').classList.remove('hidden');
            document.getElementById('question-modal').classList.add('flex');
        }

        function handleAnswer(selectedIndex, correctIndex, explanation, ballElement) {
            const btns = document.querySelectorAll('.option-btn');
            
            // Disable all buttons to prevent multiple clicks
            btns.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300');
            });

            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackTitle = document.getElementById('feedback-title');
            const explanationText = document.getElementById('explanation-text');

            if (selectedIndex === correctIndex) {
                // Correct
                btns[selectedIndex].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                feedbackContainer.classList.remove('hidden', 'bg-red-50', 'text-red-900');
                feedbackContainer.classList.add('block', 'bg-green-50', 'text-green-900', 'border', 'border-green-200');
                feedbackTitle.innerText = "🎉 Benar!";
                score++;
                playCorrectSound();
                showFireworks();
            } else {
                // Wrong
                btns[selectedIndex].classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                btns[correctIndex].classList.add('bg-green-100', 'border-green-500', 'text-green-800'); // Show correct
                feedbackContainer.classList.remove('hidden', 'bg-green-50', 'text-green-900');
                feedbackContainer.classList.add('block', 'bg-red-50', 'text-red-900', 'border', 'border-red-200');
                feedbackTitle.innerText = "❌ Kurang Tepat!";
                playWrongSound();
                showSadFace();
            }

            explanationText.innerText = "Pembahasan: " + explanation;
            answeredCount++;
            
            // Mark ball as answered
            balls[currentBallIndex].answered = true;

            updateUI();
            
            // Show Lanjut button
            document.getElementById('btn-lanjut').classList.remove('hidden');
        }

        function updateUI() {
            progressText.innerText = `${answeredCount} / 10`;
            scoreText.innerText = score;
        }

        document.getElementById('btn-lanjut').addEventListener('click', () => {
            document.getElementById('question-modal').classList.add('hidden');
            document.getElementById('question-modal').classList.remove('flex');
            
            // Hide the ball
            balls[currentBallIndex].el.classList.add('answered');

            if (answeredCount >= 10) {
                showEndScreen();
            } else {
                isPaused = false; // Resume animation
            }
        });

        function showEndScreen() {
            const endModal = document.getElementById('end-modal');
            document.getElementById('final-correct').innerText = score;
            document.getElementById('final-wrong').innerText = 10 - score;
            
            // Calculate final score (0-100)
            const finalScoreVal = (score / 10) * 100;
            document.getElementById('final-score').innerText = finalScoreVal;

            endModal.classList.remove('hidden');
            endModal.classList.add('flex');
        }

        // Handle window resize dynamically to prevent balls going out of bounds
        window.addEventListener('resize', () => {
            const containerRect = gameContainer.getBoundingClientRect();
            balls.forEach(ball => {
                if(ball.x + ball.size > containerRect.width) ball.x = containerRect.width - ball.size;
                if(ball.y + ball.size > containerRect.height) ball.y = containerRect.height - ball.size;
            });
        });

        //
        // -- AUDIO LOGIC --
        async function initAudio() {
            if (!audioInitialized) {
                await Tone.start();
                audioInitialized = true;
            }
        }

        function playCorrectSound() {
            if (!audioInitialized) return;
            const synth = new Tone.PolySynth(Tone.Synth).toDestination();
            const now = Tone.now();
            synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
        }

        function playWrongSound() {
            if (!audioInitialized) return;
            const synth = new Tone.Synth({ oscillator: { type: "triangle" } }).toDestination();
            const now = Tone.now();
            synth.triggerAttackRelease("D3", "8n", now);
            synth.triggerAttackRelease("C#3", "8n", now + 0.2);
            synth.triggerAttackRelease("C3", "4n", now + 0.4);
        }

        // -- VISUAL EFFECTS --
        function showFireworks() {
            const container = document.getElementById('effect-container');
            container.innerHTML = ''; 
            const particleColors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Randomize style
                particle.style.backgroundColor = particleColors[Math.floor(Math.random() * particleColors.length)];
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 250;
                
                particle.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
                particle.style.setProperty('--initialY', `${(Math.random() - 0.5) * 50}px`);
                
                container.appendChild(particle);
            }
            
            setTimeout(() => { container.innerHTML = ''; }, 1200);
        }

        function showSadFace() {
            const container = document.getElementById('effect-container');
            container.innerHTML = '<div class="sad-face">😢</div>';
            setTimeout(() => { container.innerHTML = ''; }, 2000);
        }

        // -- PAUSE LOGIC --
        const pauseBtn = document.getElementById('pause-btn');
        pauseBtn.addEventListener('click', () => {
            isUserPaused = !isUserPaused;
            updatePauseButtonUI();
        });

        function updatePauseButtonUI() {
            if (isUserPaused) {
                pauseBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                    Lanjut Bola
                `;
                pauseBtn.classList.remove('bg-yellow-400', 'hover:bg-yellow-500', 'text-yellow-900', 'border-yellow-500');
                pauseBtn.classList.add('bg-green-500', 'hover:bg-green-600', 'text-white', 'border-green-600');
            } else {
                pauseBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                    Pause Bola
                `;
                pauseBtn.classList.remove('bg-green-500', 'hover:bg-green-600', 'text-white', 'border-green-600');
                pauseBtn.classList.add('bg-yellow-400', 'hover:bg-yellow-500', 'text-yellow-900', 'border-yellow-500');
            }
        }

        // Start game on load
        window.onload = initGame;

    </script>
</body>
</html>
